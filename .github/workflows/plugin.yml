name: plugin
run-name: plugin lane
# Plugin-lane gate (see CONTRIBUTING.md): full JUCE builds on Linux + macOS,
# C++ unit tests, and the research-seam CLI build. Runs on PRs (fork or
# same-repo) and on pushes to main. Path-filtered so research-only changes
# don't pay for two JUCE builds.
on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'tests/**'
      - 'Resources/**'
      - 'Tunings/**'
      - '*.jucer'
      - 'version.h'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'tests/**'
      - 'Resources/**'
      - 'Tunings/**'
      - '*.jucer'
      - 'version.h'
      - '.github/workflows/plugin.yml'
jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Build
        run: |
            # Install JUCE Linux dependencies
            sudo apt update
            sudo apt install libasound2-dev libjack-jackd2-dev \
                ladspa-sdk \
                libcurl4-openssl-dev  \
                libfreetype-dev libfontconfig1-dev \
                libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
                libwebkit2gtk-4.1-dev \
                libglu1-mesa-dev mesa-common-dev libegl-dev

            # Use clang as the compiler
            sudo apt install clang
            export CXX=clang++
            export CC=clang

            # Build Projucer
            git clone --depth=1 -b 9.0.1 https://github.com/juce-framework/JUCE.git ~/JUCE
            cd ~/JUCE/extras/Projucer/Builds/LinuxMakefile/
            make -j4
            cd -

            # Build Wilsonic
            ~/JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave Wilsonic.jucer
            cd Builds/LinuxMakefile
            make -j4 CONFIG=Release
            cd -
            mkdir upload
            cp -r Builds/LinuxMakefile/build/Wilsonic.vst3 upload
            cp Builds/LinuxMakefile/build/Wilsonic upload

            # Build WilsonicController
            rm -r Builds
            ~/JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave WilsonicController.jucer
            cd Builds/LinuxMakefile
            make -j4 CONFIG=Release
            cd -
            cp -r Builds/LinuxMakefile/build/WilsonicController.vst3 upload
            cp Builds/LinuxMakefile/build/WilsonicController upload

            # build and run unit tests (test_wilsonicmath + test_tuning,
            # which compile real Source/ tuning code against stub headers)
            make -C tests run

            # build the research-seam CLI (tests/research_cli.cpp compiles
            # real Source/ tuning code for the Python harness). A Source/
            # refactor that breaks this breaks the research lane — catch it
            # here, in the plugin lane that caused it. See CONTRIBUTING.md.
            make -C tests research_cli


      - uses: actions/upload-artifact@v4
        with:
            name: Wilsonic_Linux_${{ github.sha }}
            path: upload
  build_mac:
    runs-on: macos-15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Build
        run: |
            # Build Projucer
            git clone --depth=1 -b 9.0.1 https://github.com/juce-framework/JUCE.git ~/JUCE
            cd ~/JUCE/extras/Projucer/Builds/MacOSX
            xcodebuild -project Projucer.xcodeproj
            cd -

            # Build Wilsonic
            ~/JUCE/extras/Projucer/Builds/MacOSX/build/Debug/Projucer.app/Contents/MacOS/Projucer --resave Wilsonic.jucer
            cd Builds/MacOSX
            xcodebuild -project Wilsonic.xcodeproj -scheme 'Wilsonic - All' -sdk macosx15.5 CODE_SIGN_IDENTITY="-"
            cd -

            # Build WilsonicController
            rm -r Builds
            ~/JUCE/extras/Projucer/Builds/MacOSX/build/Debug/Projucer.app/Contents/MacOS/Projucer --resave WilsonicController.jucer
            cd Builds/MacOSX
            xcodebuild -project WilsonicController.xcodeproj -scheme 'WilsonicController - All' -sdk macosx15.5 CODE_SIGN_IDENTITY="-"
