name: release
run-name: release ${{ inputs.version || github.ref_name }}
# The release pipeline from plans/release-pipeline.md. Phase 2: only the
# prepare and mac jobs, unsigned. The windows and release jobs, signing and
# notarization come in later phases.
#
# Runs on a v* tag push, by hand, and on pull requests that touch the
# release tooling. A manual run never publishes anything in this phase: the
# .pkg and the dSYMs stay attached to the workflow run as artifacts for 90
# days.
#
# The pull_request trigger is a permanent unsigned dry run of prepare and
# mac, so a change to release/ or to this file is exercised on a real runner
# before it merges. It is safe because that path signs nothing and reads no
# secrets: prepare forces SIGNING=0 on pull_request and the artifact keeps
# its -unsigned suffix. Phase 3 adds signing and notarization only for tag
# push and workflow_dispatch, never for pull_request, where secrets are not
# available to forks anyway.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'release/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version. Must equal VERSION.txt when set; it is a guard, not an override.'
        required: false
        type: string
      publish:
        description: 'Create a draft GitHub release (reserved for the release job, Phase 5; ignored today)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_TAG: 9.0.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      signing: ${{ steps.version.outputs.signing }}
      mac_asset: ${{ steps.version.outputs.mac_asset }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: scripts/check-version.sh
      - name: Check tag matches VERSION.txt
        # Only a real tag push has a tag to compare; a pull_request dry run
        # and a manual run skip this.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-version.sh --tag "${GITHUB_REF_NAME}"
      - name: Check requested version matches VERSION.txt
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: scripts/check-version.sh --tag "v${{ inputs.version }}"
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          case "$version" in
            *-*) is_prerelease=true ;;
            *)   is_prerelease=false ;;
          esac
          # A pull_request run is a dry run: never signed, never published.
          # Phase 3 will set signing=1 for tag push and workflow_dispatch
          # when the Apple secrets exist; until then every run is unsigned.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            dry_run=true
          else
            dry_run=false
          fi
          signing=0
          if [ "$signing" = "1" ]; then
            mac_asset="Wilsonic_Mac_v${version}.pkg"
          else
            mac_asset="Wilsonic_Mac_v${version}-unsigned.pkg"
          fi
          {
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "dry_run=$dry_run"
            echo "signing=$signing"
            echo "mac_asset=$mac_asset"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, prerelease $is_prerelease, dry run $dry_run, signing $signing, mac asset $mac_asset, publish ${{ inputs.publish || false }}"

  mac:
    needs: prepare
    runs-on: macos-15
    # plugin.yml builds both projects in Debug in about 90 minutes. A Release
    # build still running after four hours is stuck, so fail it then instead
    # of waiting out GitHub's six-hour job limit.
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the packaging script
        run: release/mac/test-build-pkg.sh

      # Same recipe as plugin.yml: clone JUCE at the pinned tag, build the
      # Projucer, resave both projects, build both with xcodebuild. The clone
      # must come before the cache restore, because git refuses to clone into
      # the non-empty folder the cache would leave behind.
      - name: Clone JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth=1 -b "$JUCE_TAG" https://github.com/juce-framework/JUCE.git ~/JUCE

      - name: Restore the Projucer build
        id: projucer
        uses: actions/cache@v4
        with:
          path: ~/JUCE/extras/Projucer/Builds/MacOSX/build
          key: projucer-macos-15-juce-${{ env.JUCE_TAG }}

      - name: Build the Projucer
        if: steps.projucer.outputs.cache-hit != 'true'
        run: |
          cd ~/JUCE/extras/Projucer/Builds/MacOSX
          xcodebuild -project Projucer.xcodeproj

      - name: Resave the projects
        run: |
          PROJUCER=~/JUCE/extras/Projucer/Builds/MacOSX/build/Debug/Projucer.app/Contents/MacOS/Projucer
          "$PROJUCER" --resave Wilsonic.jucer
          "$PROJUCER" --resave WilsonicController.jucer

      # The Release configurations of both .jucer files set vst3BinaryLocation
      # and auBinaryLocation, so the exported Xcode projects end with an
      # "Install Target" phase that copies each plugin into
      # /Library/Audio/Plug-Ins. The runner user cannot write there and the
      # build fails with "ditto: Permission denied". The folders are empty on
      # a fresh runner, so hand them to the runner user before building.
      - name: Make the system plug-in folders writable
        run: |
          sudo mkdir -p /Library/Audio/Plug-Ins/Components /Library/Audio/Plug-Ins/VST3
          sudo chown -R "$(id -un)" /Library/Audio/Plug-Ins

      # The Projucer turns full link-time optimisation on for every Release
      # configuration (LLVM_LTO=YES is its default for non-debug builds, and
      # neither .jucer overrides it). On GitHub's 3-core macOS runners that is
      # six monolithic LTO links per project (three formats times two
      # architectures), and the Wilsonic build alone ran past the 6-hour job
      # limit in runs 42952880906 and 42958231779. LLVM_LTO=NO on the command
      # line wins over the project setting and makes it an ordinary -O3 link.
      # Xcode builds on a developer Mac still use LTO. Revisit with YES_THIN or
      # a larger runner once this plain build has a known duration.
      #
      # The generic destination matters too. Without it a scheme build picks
      # "My Mac" as its destination, which sets ONLY_ACTIVE_ARCH=YES and
      # produces arm64-only bundles (run 43001616208 did exactly that). The
      # generic macOS destination honours the project's ARCHS, arm64 and
      # x86_64, so the plugins are universal like libMTS.dylib.
      - name: Build Wilsonic (Release, ad-hoc signed)
        run: |
          cd Builds/MacOSX
          xcodebuild -project Wilsonic.xcodeproj -scheme 'Wilsonic - All' \
            -configuration Release -sdk macosx15.5 -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" LLVM_LTO=NO

      - name: Build WilsonicController (Release, ad-hoc signed)
        run: |
          cd Builds/MacOSX-WilsonicController
          xcodebuild -project WilsonicController.xcodeproj -scheme 'WilsonicController - All' \
            -configuration Release -sdk macosx15.5 -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" LLVM_LTO=NO

      - name: Build the installer
        # SIGNING comes from prepare, which is 0 on pull_request without
        # exception. build-pkg.sh names the output -unsigned.pkg when 0.
        env:
          SIGNING: ${{ needs.prepare.outputs.signing }}
        run: |
          release/mac/build-pkg.sh --out release/out
          test -f "release/out/${{ needs.prepare.outputs.mac_asset }}"

      - name: Collect dSYMs
        run: |
          mkdir -p release/dsyms
          for d in Builds/MacOSX/build/Release Builds/MacOSX-WilsonicController/build/Release; do
            for s in "$d"/*.dSYM; do
              if [ -d "$s" ]; then ditto "$s" "release/dsyms/$(basename "$s")"; fi
            done
          done
          ls -la release/dsyms

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.signing == '1' && format('Wilsonic_Mac_v{0}', env.VERSION) || format('Wilsonic_Mac_v{0}-unsigned', env.VERSION) }}
          path: release/out/${{ needs.prepare.outputs.mac_asset }}
          if-no-files-found: error

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: Wilsonic_Mac_v${{ env.VERSION }}-dSYMs
          path: release/dsyms
          if-no-files-found: warn
