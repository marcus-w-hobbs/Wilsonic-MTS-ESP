name: release
run-name: release ${{ inputs.version || github.ref_name }}
# The release pipeline from plans/release-pipeline.md. Phases 2, 3 and 4: the
# prepare, mac and windows jobs. The release job comes in Phase 5.
#
# Runs on a v* tag push, by hand, and on pull requests that touch the
# release tooling. A manual run never publishes anything in this phase: the
# .pkg, the .exe, the dSYMs and the PDBs stay attached to the workflow run as
# artifacts for 90 days.
#
# A tag push and a manual run sign the macOS package with the Developer ID
# certificates, notarize it with Apple and staple the ticket (Phase 3). Six
# APPLE_* secrets feed that, and a run that is missing one fails in the first
# minute of the mac job with the name of the secret. It never falls back to
# an unsigned package. The secrets are tried out before the build and the
# keychain is deleted again; it is made a second time only once the build has
# finished, so nothing that runs during the build can reach a signing key.
# The Windows installer is unsigned on every kind of run.
#
# The pull_request trigger is a permanent unsigned dry run of prepare, mac
# and windows, so a change to release/ or to this file is exercised on real
# runners before it merges. It is safe because that path signs nothing and
# reads no secrets: prepare forces signing=0 on pull_request, every step that
# names a secret is skipped on that output, signing-keychain.sh refuses a
# pull_request event on its own account, and the artifacts keep their
# -unsigned suffix. Secrets are not available to pull requests from forks in
# any case. A dry run also builds without debug symbols and uploads no dSYMs
# or PDBs: dsymutil on the universal binaries cost 65 and 47 minutes of the
# 3 h 39 min job in run 43054238610, and a dry run only has to prove the
# pipeline. Without -g the compiles are faster too, so the dry run took
# 1 h 02 min in run 43669865878, about a quarter of a real build.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'release/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version. Must equal VERSION.txt when set; it is a guard, not an override.'
        required: false
        type: string
      publish:
        description: 'Create a draft GitHub release (reserved for the release job, Phase 5; ignored today)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_TAG: 9.0.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      signing: ${{ steps.version.outputs.signing }}
      debug_symbols: ${{ steps.version.outputs.debug_symbols }}
      mac_asset: ${{ steps.version.outputs.mac_asset }}
      win_signing: ${{ steps.version.outputs.win_signing }}
      win_asset: ${{ steps.version.outputs.win_asset }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: scripts/check-version.sh
      - name: Check tag matches VERSION.txt
        # Only a real tag push has a tag to compare; a pull_request dry run
        # and a manual run skip this.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-version.sh --tag "${GITHUB_REF_NAME}"
      - name: Check requested version matches VERSION.txt
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # Through the environment, so the typed value is data to the shell
        # and never part of the script.
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: scripts/check-version.sh --tag "v${REQUESTED_VERSION}"
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          case "$version" in
            *-*) is_prerelease=true ;;
            *)   is_prerelease=false ;;
          esac
          # A pull_request run is a dry run: never signed, never published.
          # A tag push and a manual run are always signed and notarized on
          # the Mac; there is no unsigned variant of those, so a missing
          # secret fails the mac job and does not quietly produce an
          # unsigned package. A dry run also skips debug symbols, so no
          # dSYMs are generated or uploaded and the mac job takes about a
          # quarter of the time.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            dry_run=true
            debug_symbols=NO
            signing=0
          else
            dry_run=false
            debug_symbols=YES
            signing=1
          fi
          if [ "$signing" = "1" ]; then
            mac_asset="Wilsonic_Mac_v${version}.pkg"
          else
            mac_asset="Wilsonic_Mac_v${version}-unsigned.pkg"
          fi
          # Windows code signing is off for now (decision 4 in the plan), on
          # every kind of run, so the installer always carries -unsigned.
          win_signing=0
          if [ "$win_signing" = "1" ]; then
            win_asset="Wilsonic_Win64_v${version}.exe"
          else
            win_asset="Wilsonic_Win64_v${version}-unsigned.exe"
          fi
          {
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "dry_run=$dry_run"
            echo "signing=$signing"
            echo "debug_symbols=$debug_symbols"
            echo "mac_asset=$mac_asset"
            echo "win_signing=$win_signing"
            echo "win_asset=$win_asset"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, prerelease $is_prerelease, dry run $dry_run, signing $signing, debug symbols $debug_symbols, mac asset $mac_asset, windows signing $win_signing, windows asset $win_asset, publish $PUBLISH"

  mac:
    needs: prepare
    runs-on: macos-15
    # A universal Release build of both projects took 3 h 44 min on the hosted
    # runner (run 43010618605: Wilsonic 106 min, WilsonicController 116 min,
    # most of each inside dsymutil). Give it five and a half hours so a slow
    # runner still finishes, but a stuck build fails before GitHub's six-hour
    # job limit kills it without logs.
    timeout-minutes: 330
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # YES on tag push and workflow_dispatch, NO on the pull_request dry run.
      # NO drops -g from every compile and skips dsymutil, so no dSYM exists
      # to collect; the two dSYM steps below are skipped on the same flag.
      DEBUG_SYMBOLS: ${{ needs.prepare.outputs.debug_symbols }}
      # 1 on tag push and workflow_dispatch, 0 on the pull_request dry run.
      # build-pkg.sh signs and drops the -unsigned suffix when it is 1.
      SIGNING: ${{ needs.prepare.outputs.signing }}
      # The two identities are the names on the certificates, which every
      # signed binary shows to anyone who asks, so they are not secrets.
      DEVELOPER_ID_APP: 'Developer ID Application: Perfect Buzz Music (LXFXL9GS49)'
      DEVELOPER_ID_INSTALLER: 'Developer ID Installer: Perfect Buzz Music (LXFXL9GS49)'
    steps:
      - uses: actions/checkout@v4

      - name: Test the packaging and signing scripts
        run: |
          bash --version | head -1
          release/mac/test-build-pkg.sh
          release/mac/test-signing.sh

      # Signed runs only. This comes before the build on purpose: it makes
      # the temporary keychain, imports both .p12 files, signs a scratch file
      # with each identity and asks App Store Connect for the notarization
      # history, so a missing secret, a wrong .p12 password, an expired
      # certificate or a wrong issuer ID stops the job here, with the name of
      # the secret, and not three and a half hours later. Then it deletes the
      # keychain and the decoded key again, pass or fail, so that JUCE, the
      # Projucer and xcodebuild below never run beside a signing key. The
      # script prints no secret and has tracing off.
      - name: Check the Apple secrets
        if: github.event_name != 'pull_request' && needs.prepare.outputs.signing == '1'
        env:
          APPLE_DEV_ID_APP_P12: ${{ secrets.APPLE_DEV_ID_APP_P12 }}
          APPLE_DEV_ID_INSTALLER_P12: ${{ secrets.APPLE_DEV_ID_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: release/mac/signing-keychain.sh check

      # Same recipe as plugin.yml: clone JUCE at the pinned tag, build the
      # Projucer, resave both projects, build both with xcodebuild. The clone
      # must come before the cache restore, because git refuses to clone into
      # the non-empty folder the cache would leave behind.
      - name: Clone JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth=1 -b "$JUCE_TAG" https://github.com/juce-framework/JUCE.git ~/JUCE

      - name: Restore the Projucer build
        id: projucer
        uses: actions/cache@v4
        with:
          path: ~/JUCE/extras/Projucer/Builds/MacOSX/build
          key: projucer-macos-15-juce-${{ env.JUCE_TAG }}

      - name: Build the Projucer
        if: steps.projucer.outputs.cache-hit != 'true'
        run: |
          cd ~/JUCE/extras/Projucer/Builds/MacOSX
          xcodebuild -project Projucer.xcodeproj

      - name: Resave the projects
        run: |
          PROJUCER=~/JUCE/extras/Projucer/Builds/MacOSX/build/Debug/Projucer.app/Contents/MacOS/Projucer
          "$PROJUCER" --resave Wilsonic.jucer
          "$PROJUCER" --resave WilsonicController.jucer

      # The Release configurations of both .jucer files set vst3BinaryLocation
      # and auBinaryLocation, so the exported Xcode projects end with an
      # "Install Target" phase that copies each plugin into
      # /Library/Audio/Plug-Ins. The runner user cannot write there and the
      # build fails with "ditto: Permission denied". The folders are empty on
      # a fresh runner, so hand them to the runner user before building.
      - name: Make the system plug-in folders writable
        run: |
          sudo mkdir -p /Library/Audio/Plug-Ins/Components /Library/Audio/Plug-Ins/VST3
          sudo chown -R "$(id -un)" /Library/Audio/Plug-Ins

      # The Projucer turns full link-time optimisation on for every Release
      # configuration (LLVM_LTO=YES is its default for non-debug builds, and
      # neither .jucer overrides it). On GitHub's 3-core macOS runners that is
      # six monolithic LTO links per project (three formats times two
      # architectures), and the Wilsonic build alone ran past the 6-hour job
      # limit in runs 42952880906 and 42958231779. LLVM_LTO=NO on the command
      # line wins over the project setting and makes it an ordinary -O3 link.
      # Xcode builds on a developer Mac still use LTO. Revisit with YES_THIN or
      # a larger runner once this plain build has a known duration.
      #
      # The generic destination matters too. Without it a scheme build picks
      # "My Mac" as its destination, which sets ONLY_ACTIVE_ARCH=YES and
      # produces arm64-only bundles (run 43001616208 did exactly that). The
      # generic macOS destination honours the project's ARCHS, arm64 and
      # x86_64, so the plugins are universal like libMTS.dylib.
      #
      # The build is signed ad hoc on every kind of run, signed runs
      # included. build-pkg.sh puts the Developer ID signature on afterwards,
      # so Xcode never needs the keychain, no keychain exists while this
      # runs, and a dry run builds exactly what a release builds.
      - name: Build Wilsonic (Release, ad-hoc signed)
        run: |
          cd Builds/MacOSX
          xcodebuild -project Wilsonic.xcodeproj -scheme 'Wilsonic - All' \
            -configuration Release -sdk macosx15.5 -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" LLVM_LTO=NO GCC_GENERATE_DEBUGGING_SYMBOLS="$DEBUG_SYMBOLS"

      - name: Build WilsonicController (Release, ad-hoc signed)
        run: |
          cd Builds/MacOSX-WilsonicController
          xcodebuild -project WilsonicController.xcodeproj -scheme 'WilsonicController - All' \
            -configuration Release -sdk macosx15.5 -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" LLVM_LTO=NO GCC_GENERATE_DEBUGGING_SYMBOLS="$DEBUG_SYMBOLS"

      # Signed runs only. The build is over, so make the keychain for real:
      # the same script and the same checks as before the build, and this
      # time it stays, with SIGNING_KEYCHAIN and NOTARY_KEY_FILE left in the
      # environment for the three steps below.
      - name: Set up signing
        if: github.event_name != 'pull_request' && needs.prepare.outputs.signing == '1'
        env:
          APPLE_DEV_ID_APP_P12: ${{ secrets.APPLE_DEV_ID_APP_P12 }}
          APPLE_DEV_ID_INSTALLER_P12: ${{ secrets.APPLE_DEV_ID_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: release/mac/signing-keychain.sh setup

      - name: Build the installer
        # SIGNING comes from prepare, which is 0 on pull_request without
        # exception. build-pkg.sh names the output -unsigned.pkg when 0.
        # When 1 it signs the six bundles with the hardened runtime and a
        # secure timestamp, then signs the package, from the keychain the
        # step above made.
        run: |
          release/mac/build-pkg.sh --out release/out
          test -f "release/out/${{ needs.prepare.outputs.mac_asset }}"

      # Submit to Apple and wait, print Apple's log for the submission
      # whatever the verdict, fail on anything but Accepted, then staple the
      # ticket to the package so it installs on a Mac that is offline.
      - name: Notarize and staple the installer
        if: github.event_name != 'pull_request' && needs.prepare.outputs.signing == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: release/mac/notarize.sh "release/out/${{ needs.prepare.outputs.mac_asset }}"

      # pkgutil --check-signature, spctl -a -vv -t install, stapler validate,
      # and codesign --verify --deep --strict on each bundle inside. One miss
      # fails the job, and the upload below then never happens.
      - name: Verify the signed installer
        if: needs.prepare.outputs.signing == '1'
        run: release/mac/verify-pkg.sh "release/out/${{ needs.prepare.outputs.mac_asset }}"

      # Always, pass or fail: the keychain and the decoded .p8 do not outlive
      # the steps that need them.
      - name: Delete the signing keychain and the decoded keys
        if: always() && needs.prepare.outputs.signing == '1'
        run: release/mac/signing-keychain.sh teardown

      # The universal dSYMs are a few gigabytes and the runner disk is nearly
      # full by now, so move them instead of copying (run 43010618605 died
      # here with "No space left on device" on a ditto copy), then delete the
      # object files in DerivedData so upload-artifact has room for its zip.
      - name: Collect dSYMs
        if: needs.prepare.outputs.debug_symbols == 'YES'
        run: |
          df -h /
          mkdir -p release/dsyms
          for d in Builds/MacOSX/build/Release Builds/MacOSX-WilsonicController/build/Release; do
            for s in "$d"/*.dSYM; do
              if [ -d "$s" ]; then mv "$s" "release/dsyms/$(basename "$s")"; fi
            done
          done
          rm -rf ~/Library/Developer/Xcode/DerivedData
          du -sh release/dsyms/*
          df -h /

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.signing == '1' && format('Wilsonic_Mac_v{0}', env.VERSION) || format('Wilsonic_Mac_v{0}-unsigned', env.VERSION) }}
          path: release/out/${{ needs.prepare.outputs.mac_asset }}
          if-no-files-found: error

      - name: Upload dSYMs
        if: needs.prepare.outputs.debug_symbols == 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: Wilsonic_Mac_v${{ env.VERSION }}-dSYMs
          path: release/dsyms
          if-no-files-found: warn

  windows:
    needs: prepare
    runs-on: windows-2022
    # The job took 26 min 19 s and 31 min 14 s with debug symbols (runs
    # 43763913790 and 43767579628) and 31 min 43 s as a dry run (run
    # 43763872675); two builds of eleven to fourteen minutes each are nearly
    # all of it. Ninety minutes lets a
    # slow runner finish and still fails a stuck build early.
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash, so the same scripts run here and under the test on a Mac.
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # YES on tag push and workflow_dispatch, NO on the pull_request dry run.
      # build-project.sh turns NO into no /Zi and no .pdb. Unlike on the Mac
      # this saves almost no time (about half a minute per project); it is
      # here so both platforms follow one rule.
      DEBUG_SYMBOLS: ${{ needs.prepare.outputs.debug_symbols }}
      # The Projucer turns whole program optimisation (/GL and /LTCG) on for
      # every Release configuration, and neither .jucer overrides it. On this
      # runner that build does not finish at all: in run 43761715303 the
      # WilsonicController shared-code library, compiled with /GL, came to
      # more than 4 GB and the librarian stopped with "LNK1248: image size
      # exceeds maximum allowable size" after seven minutes. NO makes it an
      # ordinary /O2 build, which took 10 min 37 s for Wilsonic in the same
      # run. build-project.sh passes the switch and then checks the compiler
      # command lines in the log, so it cannot silently stop working.
      LTO: 'NO'
    steps:
      - uses: actions/checkout@v4

      # First, because nothing below can work without it: both .jucer files
      # need a Visual Studio 2022 exporter with a Release configuration. If
      # one is missing the step says which, and the fix is a plugin-lane
      # change to a .jucer, not something this job does.
      - name: Check both projects have a Visual Studio 2022 exporter
        run: release/windows/check-exporter.sh

      - name: Test the Windows release scripts
        run: release/windows/test-windows-scripts.sh

      - name: Put msbuild on PATH
        uses: microsoft/setup-msbuild@v2

      # Every module in both .jucer files uses the Projucer's global module
      # path, and on Windows that defaults to C:\JUCE\modules, so the clone
      # goes to C:\JUCE. As in the mac job, the clone comes before the cache
      # restore, because git refuses to clone into a non-empty folder.
      - name: Clone JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth=1 -b "$JUCE_TAG" https://github.com/juce-framework/JUCE.git /c/JUCE

      - name: Restore the Projucer build
        id: projucer
        uses: actions/cache@v4
        with:
          path: C:\JUCE\extras\Projucer\Builds\VisualStudio2022\x64\Release\App\Projucer.exe
          key: projucer-windows-2022-juce-${{ env.JUCE_TAG }}

      - name: Build the Projucer
        if: steps.projucer.outputs.cache-hit != 'true'
        run: |
          msbuild.exe 'C:\JUCE\extras\Projucer\Builds\VisualStudio2022\Projucer.sln' \
            -m -nologo -v:minimal -p:Configuration=Release -p:Platform=x64

      - name: Resave the projects
        run: |
          PROJUCER='/c/JUCE/extras/Projucer/Builds/VisualStudio2022/x64/Release/App/Projucer.exe'
          "$PROJUCER" --resave Wilsonic.jucer
          "$PROJUCER" --resave WilsonicController.jucer
          # The Projucer is a GUI program, so do not trust its exit status alone.
          test -f Builds/VisualStudio2022/Wilsonic.sln
          test -f Builds/VisualStudio2022-WilsonicController/WilsonicController.sln

      - name: Build Wilsonic (Release, x64)
        run: release/windows/build-project.sh Builds/VisualStudio2022/Wilsonic.sln

      - name: Build WilsonicController (Release, x64)
        run: release/windows/build-project.sh Builds/VisualStudio2022-WilsonicController/WilsonicController.sln

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wilsonic_Win64_v${{ env.VERSION }}-build-logs
          path: Builds/VisualStudio2022*/msbuild-*.log
          if-no-files-found: ignore

      # Windows code signing is off (decision 4 in plans/release-pipeline.md),
      # and this step is where it goes when that changes. It does not run
      # while prepare outputs win_signing=0, and it reads no secret: the env
      # block that would read them is commented out. To turn signing on, add
      # the two secrets, uncomment the env block, and make prepare output
      # win_signing=1 for tag and manual runs only, never for pull_request.
      # build-installer.sh then passes SIGNTOOL_COMMAND to Inno Setup, which
      # signs the four products, the uninstaller and the installer itself.
      # Nobody has run this with a real certificate. New certificates live on
      # hardware or in a cloud service rather than in a .pfx, so the likely
      # real version replaces the body below with Azure Trusted Signing's
      # signtool arguments and keeps the SIGNTOOL_COMMAND line.
      - name: Set up code signing (disabled)
        if: needs.prepare.outputs.win_signing == '1'
        shell: pwsh
        # env:
        #   WINDOWS_SIGNING_CERT_PFX: ${{ secrets.WINDOWS_SIGNING_CERT_PFX }}            # base64 of the .pfx
        #   WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          # Inno Setup's sign tool syntax: $q is a quote, $f the quoted file name.
          "SIGNTOOL_COMMAND=`$q$signtool`$q sign /sha1 $($cert.Thumbprint) /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `$f" >> $env:GITHUB_ENV

      - name: Build the installer
        # SIGNING comes from prepare, which is 0 today on every kind of run.
        # build-installer.sh names the output -unsigned.exe when 0.
        env:
          SIGNING: ${{ needs.prepare.outputs.win_signing }}
        run: |
          release/windows/build-installer.sh --out release/out
          test -f "release/out/${{ needs.prepare.outputs.win_asset }}"

      # Install it on the runner, silently, and look at what it did: the six
      # files, an existing MTS-ESP.conf left alone, a missing one written,
      # and the shared MTS-ESP files still there after an uninstall. This is
      # a Windows Server image with no audio host, so it says nothing about
      # whether the plugin works in a DAW.
      - name: Smoke-test the installer
        shell: pwsh
        run: release/windows/smoke-install.ps1 -Installer "release/out/${{ needs.prepare.outputs.win_asset }}" -Version $env:VERSION

      # The same again as an upgrade: install the last release made with the
      # old installer, then this one over it. One entry under Apps, the older
      # LIBMTS.dll replaced by the pinned one, and an uninstall that still
      # leaves the shared MTS-ESP files, which is what UninstallLogMode in
      # wilsonic.iss is for. The old installer is this repo's own public
      # release asset, fetched without a token and checked against its
      # sha256. After the first release from this pipeline, point both lines
      # at that release instead.
      - name: Smoke-test an upgrade over v0.43
        shell: pwsh
        env:
          UPGRADE_FROM_URL: https://github.com/marcus-w-hobbs/Wilsonic-MTS-ESP/releases/download/v0.43-beta/WilsonicInstaller64_0_43b.exe
          UPGRADE_FROM_SHA256: 8467f49edc5d35dde92f28e4e919480aaf51005bc4b00182626907b52cb9828a
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'WilsonicInstaller64_0_43b.exe'
          Invoke-WebRequest -Uri $env:UPGRADE_FROM_URL -OutFile $old
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $old).Hash.ToLower()
          if ($hash -ne $env:UPGRADE_FROM_SHA256) { throw "the v0.43 installer has sha256 $hash, expected $env:UPGRADE_FROM_SHA256" }
          release/windows/smoke-install.ps1 -Installer "release/out/${{ needs.prepare.outputs.win_asset }}" -Version $env:VERSION -UpgradeFrom $old

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.win_signing == '1' && format('Wilsonic_Win64_v{0}', env.VERSION) || format('Wilsonic_Win64_v{0}-unsigned', env.VERSION) }}
          path: release/out/${{ needs.prepare.outputs.win_asset }}
          if-no-files-found: error

      - name: Upload PDBs
        if: needs.prepare.outputs.debug_symbols == 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: Wilsonic_Win64_v${{ env.VERSION }}-PDBs
          path: Builds/VisualStudio2022*/x64/Release/**/*.pdb
          if-no-files-found: warn
